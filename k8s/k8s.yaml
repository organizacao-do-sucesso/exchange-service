apiVersion: v1
kind: ConfigMap
metadata:
  name: exchange-config
  namespace: store
data:
  # PTAX (Central Bank of Brazil): public, no key, and it does not block AWS IPs
  EXCHANGE_API_URL: https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata
  EXCHANGE_API_TIMEOUT_SECONDS: "3"
  # PTAX publishes a few bulletins a day: 5 min of cache keeps the load on BCB low
  EXCHANGE_CACHE_TTL_SECONDS: "300"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange
  namespace: store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exchange
  template:
    metadata:
      labels:
        app: exchange
    spec:
      containers:
        - name: exchange
          image: store/exchange:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: exchange-config
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: exchange
  namespace: store
spec:
  selector:
    app: exchange
  ports:
    - name: http
      port: 8000
      targetPort: http
